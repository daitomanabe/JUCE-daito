name: rust

on:
  push:
    branches: [develop, master, "claude/**"]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

jobs:
  check:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14         # Apple Silicon (M1)
            target: aarch64-apple-darwin
          - os: macos-13         # Intel
            target: x86_64-apple-darwin
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio / GUI dev libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --tests --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Bundle plugin (release)
        run: cargo xtask bundle plugin-synth --release --target ${{ matrix.target }}

      - name: Upload plug-in bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-synth-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/bundled/
            rust/target/bundled/
          if-no-files-found: ignore
          retention-days: 7
